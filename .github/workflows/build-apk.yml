name: Build Android APK

# Chạy tự động mỗi khi đẩy code lên nhánh main, hoặc bấm "Run workflow" thủ công
# trong tab Actions trên GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # cần quyền ghi để tạo Release đính kèm file .apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm ci

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Sync Capacitor Android project (copy www/ vào app Android)
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnglishTHPT-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Tạo GitHub Release kèm file .apk (dễ tải trên điện thoại)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "EnglishTHPT — bản build #${{ github.run_number }}"
          body: |
            APK được build tự động từ commit ${{ github.sha }}.
            Tải file .apk bên dưới về điện thoại Android rồi mở để cài đặt.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
